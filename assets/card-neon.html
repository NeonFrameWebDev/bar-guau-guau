<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:900px;overflow:hidden;background:#0A0A0A;color:#fff;font-family:'Inter',sans-serif}
  .card{
    width:600px;height:900px;position:relative;
    background:
      radial-gradient(ellipse 70% 40% at 50% 35%, rgba(230,0,35,0.35) 0%, rgba(122,0,16,0.15) 40%, transparent 70%),
      linear-gradient(180deg, #131313 0%, #0A0A0A 60%, #050505 100%);
  }
  .wall{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(180deg, transparent 0 14px, rgba(255,255,255,0.012) 14px 15px),
      repeating-linear-gradient(90deg, transparent 0 14px, rgba(255,255,255,0.012) 14px 15px);
  }
  .sign-wrap{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .sign{
    font-family:'Bebas Neue',sans-serif;
    font-size:160px;line-height:0.85;letter-spacing:6px;
    color:#FF1F40;text-align:center;
    text-shadow:
      0 0 6px #fff,
      0 0 14px rgba(255,90,110,0.95),
      0 0 30px rgba(230,0,35,0.9),
      0 0 60px rgba(230,0,35,0.6),
      0 0 110px rgba(230,0,35,0.35);
  }
  .tube-frame{
    width: 460px;height: 4px;background:#FF1F40;
    box-shadow:
      0 0 6px #fff,
      0 0 14px rgba(255,90,110,0.9),
      0 0 30px rgba(230,0,35,0.8);
    border-radius:2px;
  }
  .sublabel{
    font-family:'Bebas Neue',sans-serif;font-size:30px;
    color:#C9A24E;letter-spacing:7px;line-height:1;margin-top:4px;
  }
  .caption{
    position:absolute;bottom:30px;left:0;right:0;text-align:center;
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    color:rgba(255,255,255,0.5);letter-spacing:3px;text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="wall"></div>
  <div class="sign-wrap">
    <div class="tube-frame"></div>
    <div class="sign">GUAU<br/>GUAU</div>
    <div class="tube-frame"></div>
    <div class="sublabel">ROCKY POINT</div>
  </div>
  <div class="caption">El letrero que conoces</div>
</div>
</body>
</html>
