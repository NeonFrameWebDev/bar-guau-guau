<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0A0A0A;color:#fff;font-family:'Inter',sans-serif}
  .card{
    width:1200px;height:630px;position:relative;
    background:
      radial-gradient(ellipse 70% 50% at 25% 50%, rgba(122,0,16,0.55) 0%, rgba(122,0,16,0.18) 35%, transparent 65%),
      radial-gradient(ellipse 50% 60% at 78% 70%, rgba(230,0,35,0.18) 0%, transparent 60%),
      #0A0A0A;
    display:grid;grid-template-columns: 360px 1fr;
    align-items:center;
    padding: 0 80px;
    gap: 60px;
  }
  .card::before{
    content:"";position:absolute;inset:18px;border:1px solid rgba(230,0,35,0.18);pointer-events:none;
  }
  .diamond-wrap{
    width:340px;height:340px;justify-self:center;
    filter:
      drop-shadow(0 0 8px rgba(230,0,35,1))
      drop-shadow(0 0 30px rgba(230,0,35,0.85))
      drop-shadow(0 0 70px rgba(230,0,35,0.55))
      drop-shadow(0 0 130px rgba(230,0,35,0.3));
  }
  .text-wrap{display:flex;flex-direction:column;gap:14px;}
  .eyebrow{
    font-family:'Bebas Neue',sans-serif;font-size:32px;
    color:#C9A24E;letter-spacing:6px;line-height:1;
  }
  .wordmark{
    font-family:'Bebas Neue',sans-serif;
    font-size:200px;color:#E60023;line-height:0.85;
    letter-spacing:2px;
    text-shadow:
      0 0 6px rgba(230,0,35,0.9),
      0 0 20px rgba(230,0,35,0.6),
      0 0 50px rgba(230,0,35,0.3);
  }
  .tag{
    font-family:'Inter',sans-serif;font-weight:600;font-size:22px;
    color:rgba(255,255,255,0.78);letter-spacing:2px;text-transform:uppercase;
    margin-top:8px;
  }
  .url{
    position:absolute;bottom:42px;right:80px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:16px;
    color:rgba(255,255,255,0.4);letter-spacing:3px;text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="diamond-wrap">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="340" height="340">
      <polygon points="60,4 116,60 60,116 4,60" stroke="rgba(230,0,35,0.25)" stroke-width="0.7" fill="none"/>
      <polygon points="60,8 112,60 60,112 8,60" stroke="#E60023" stroke-width="2.5" fill="none"/>
      <polygon points="60,20 100,60 60,100 20,60" stroke="rgba(230,0,35,0.3)" stroke-width="0.7" fill="none"/>
      <text x="60" y="55" font-family="'Bebas Neue', sans-serif" font-size="34" fill="#E60023"
            text-anchor="middle" dominant-baseline="middle">G</text>
      <text x="60" y="76" font-family="'Bebas Neue', sans-serif" font-size="11" fill="#E60023"
            text-anchor="middle" dominant-baseline="middle" letter-spacing="2">GUAU GUAU</text>
    </svg>
  </div>
  <div class="text-wrap">
    <div class="eyebrow">PUERTO PEN&#771;ASCO &middot; SONORA</div>
    <div class="wordmark">GUAU<br/>GUAU</div>
    <div class="tag">Espect&aacute;culos &middot; Bar &middot; Vida nocturna</div>
  </div>
  <div class="url">neonframewebdesign.com/bar-guau-guau</div>
</div>
</body>
</html>
